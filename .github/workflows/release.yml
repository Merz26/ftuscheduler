name: Release Extension

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract version from manifest.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Skipping release creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG_NAME does not exist. Proceeding with release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and package extension zip
        if: steps.check_release.outputs.exists != 'true'
        run: |
          npm ci || npm install
          npm run build --if-present
          zip -r "ftu-schedule-sync-v${VERSION}.zip" . -x "*.git*" "node_modules/*" ".github/*"

      - name: Publish GitHub Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "v${{ steps.get_version.outputs.version }}"
          body: |
            ## FTU Schedule Sync v${{ steps.get_version.outputs.version }} Release 🎉

            Automated release generated from `main` branch.

            ### Installation Instructions
            1. Download `ftu-schedule-sync-v${{ steps.get_version.outputs.version }}.zip` from assets below.
            2. Extract the ZIP archive to a folder on your computer.
            3. Open your Chromium browser (Chrome, Edge, Brave) and go to `chrome://extensions`.
            4. Enable **Developer mode** in the top right.
            5. Click **Load unpacked** and select the unzipped directory.
          files: |
            ftu-schedule-sync-v${{ steps.get_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
